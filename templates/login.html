<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 | MatchDrawer</title>
    <link rel="icon" href="{{ url_for('static', filename='app-icon.png') }}" type="image/png">
    <style>
        :root {
            color-scheme: light;
            --bg: #f7f1e8;
            --panel: #fffaf3;
            --text: #24160f;
            --muted: #6b5545;
            --accent: #a85f2d;
            --accent-hover: #743a18;
            --accent-soft: #f2dfca;
            --border: #dbc7b5;
            --danger: #a63a2a;
            --shadow: 0 24px 60px rgba(74, 45, 25, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background: var(--bg);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .login-shell {
            width: min(100%, 980px);
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
        }

        .login-hero {
            padding: 48px;
            background: #7a3f1c;
            color: #fff6eb;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 32px;
        }

        .login-hero img {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: rgba(255, 246, 235, 0.14);
            padding: 10px;
        }

        .login-hero h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 3.25rem);
            line-height: 1.05;
        }

        .login-panel {
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-panel h2 {
            margin: 0 0 8px;
            font-size: 1.8rem;
        }

        .login-panel p {
            margin: 0 0 28px;
            color: var(--muted);
            line-height: 1.6;
        }

        .login-form {
            display: grid;
            gap: 18px;
        }

        .mode-switch {
            display: inline-grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            padding: 6px;
            border-radius: 16px;
            background: #f1dfcb;
            margin-bottom: 20px;
        }

        .mode-switch button {
            border: 0;
            border-radius: 12px;
            padding: 10px 14px;
            font: inherit;
            font-weight: 600;
            color: var(--muted);
            background: transparent;
            cursor: pointer;
        }

        .mode-switch button.is-active {
            background: #fffaf3;
            color: var(--text);
            box-shadow: 0 8px 20px rgba(31, 28, 24, 0.08);
        }

        .field {
            display: grid;
            gap: 8px;
        }

        .field label {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .field input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            font: inherit;
            background: #fffdf9;
            color: var(--text);
        }

        .field input:focus {
            outline: 2px solid rgba(168, 95, 45, 0.2);
            border-color: rgba(168, 95, 45, 0.55);
        }

        .error {
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(166, 58, 42, 0.08);
            color: var(--danger);
            border: 1px solid rgba(166, 58, 42, 0.16);
            font-size: 0.95rem;
        }

        .submit-btn {
            border: 0;
            border-radius: 14px;
            padding: 14px 18px;
            font: inherit;
            font-weight: 700;
            color: #fff;
            background: var(--accent);
            cursor: pointer;
            transition: background 0.18s ease, transform 0.18s ease;
        }

        .submit-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.75;
            cursor: wait;
            transform: none;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .checkbox-row input {
            width: 16px;
            height: 16px;
        }

        .field[hidden],
        .checkbox-row[hidden] {
            display: none;
        }

        .secondary-text {
            margin-top: 12px;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .login-hint {
            margin-top: 18px;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .login-hint code {
            background: var(--accent-soft);
            border-radius: 8px;
            padding: 2px 6px;
        }

        .status-text {
            min-height: 1.25rem;
            color: var(--muted);
            font-size: 0.92rem;
        }

        @media (max-width: 860px) {
            .login-shell {
                grid-template-columns: 1fr;
            }

            .login-hero,
            .login-panel {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <section class="login-hero">
            <div>
                <img src="{{ url_for('static', filename='app-icon.png') }}" alt="MatchDrawer">
                <h1>MatchDrawer</h1>
            </div>
        </section>
        <section class="login-panel">
            <div class="mode-switch" id="authModeSwitch">
                <button type="button" class="is-active" data-mode="login">登录</button>
                <button type="button" data-mode="register">注册</button>
            </div>
            <h2 id="panelTitle">登录</h2>
            <form class="login-form" id="loginForm" novalidate>
                <div class="error" id="loginError" {% if not error %}hidden{% endif %}>{{ error }}</div>
                <div class="field">
                    <label for="username">用户名</label>
                    <input id="username" name="username" type="text" value="admin" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">密码</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <div class="field" id="confirmPasswordField" hidden>
                    <label for="confirmPassword">确认密码</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password">
                </div>
                <label class="checkbox-row" id="rememberLoginRow">
                    <input id="rememberLogin" type="checkbox">
                    <span>记住登录</span>
                </label>
                <div class="status-text" id="loginStatus"></div>
                <button class="submit-btn" type="submit">进入工作台</button>
            </form>
        </section>
    </div>
    <script>
        (function () {
            const TOKEN_KEY = 'matchdrawer_auth_token_v1';
            const form = document.getElementById('loginForm');
            const modeSwitch = document.getElementById('authModeSwitch');
            const panelTitle = document.getElementById('panelTitle');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const confirmPasswordField = document.getElementById('confirmPasswordField');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const rememberLoginRow = document.getElementById('rememberLoginRow');
            const rememberLoginInput = document.getElementById('rememberLogin');
            const errorEl = document.getElementById('loginError');
            const statusEl = document.getElementById('loginStatus');
            const submitBtn = form ? form.querySelector('.submit-btn') : null;
            const nextUrl = {{ (next_url or '/')|tojson }};
            let authMode = 'login';

            function showError(message) {
                if (!errorEl) return;
                errorEl.textContent = message;
                errorEl.hidden = !message;
            }

            function setStatus(message) {
                if (statusEl) {
                    statusEl.textContent = message || '';
                }
            }

            function setSubmitting(isSubmitting) {
                if (!submitBtn) return;
                submitBtn.disabled = !!isSubmitting;
                submitBtn.textContent = isSubmitting
                    ? (authMode === 'register' ? '注册中...' : '登录中...')
                    : (authMode === 'register' ? '创建账号' : '进入工作台');
            }

            function validateCredentials(username, password) {
                const normalizedUsername = String(username || '').trim();
                if (!/^[A-Za-z0-9_.-]{3,32}$/.test(normalizedUsername)) {
                    return '用户名需为 3-32 位，只能包含字母、数字、下划线、点和中横线';
                }
                if (/\s/.test(password || '')) {
                    return '密码不能包含空白字符';
                }
                if (String(password || '').length < 6 || String(password || '').length > 64) {
                    return '密码长度需为 6-64 位';
                }
                return '';
            }

            function setMode(nextMode) {
                authMode = nextMode === 'register' ? 'register' : 'login';
                if (modeSwitch) {
                    modeSwitch.querySelectorAll('[data-mode]').forEach((button) => {
                        button.classList.toggle('is-active', button.dataset.mode === authMode);
                    });
                }
                if (panelTitle) {
                    panelTitle.textContent = authMode === 'register' ? '注册' : '登录';
                }
                if (confirmPasswordField) {
                    confirmPasswordField.hidden = authMode !== 'register';
                }
                if (rememberLoginRow) {
                    rememberLoginRow.hidden = authMode !== 'login';
                }
                showError('');
                setStatus('');
                setSubmitting(false);
            }

            function pemToArrayBuffer(pem) {
                const base64 = String(pem || '')
                    .replace(/-----BEGIN PUBLIC KEY-----/g, '')
                    .replace(/-----END PUBLIC KEY-----/g, '')
                    .replace(/\s+/g, '');
                const binary = window.atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i += 1) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return bytes.buffer;
            }

            async function importPublicKey(publicKeyPem) {
                return window.crypto.subtle.importKey(
                    'spki',
                    pemToArrayBuffer(publicKeyPem),
                    { name: 'RSA-OAEP', hash: 'SHA-256' },
                    false,
                    ['encrypt']
                );
            }

            async function encryptToHex(publicKey, plaintext) {
                const encoded = new TextEncoder().encode(String(plaintext || ''));
                const encrypted = await window.crypto.subtle.encrypt({ name: 'RSA-OAEP' }, publicKey, encoded);
                return Array.from(new Uint8Array(encrypted))
                    .map((byte) => byte.toString(16).padStart(2, '0'))
                    .join('');
            }

            async function validateStoredToken() {
                const token = localStorage.getItem(TOKEN_KEY) || '';
                if (!token) {
                    await tryRefreshLogin();
                    return;
                }
                try {
                    const response = await fetch('/api/auth/validate', {
                        method: 'GET',
                        headers: { Authorization: `Bearer ${token}` },
                        credentials: 'same-origin',
                    });
                    if (response.ok) {
                        window.location.replace(nextUrl || '/');
                        return;
                    }
                } catch (error) {
                    console.warn('校验已保存登录状态失败:', error);
                }
                localStorage.removeItem(TOKEN_KEY);
                await tryRefreshLogin();
            }

            async function tryRefreshLogin() {
                try {
                    const response = await fetch('/api/auth/refresh', {
                        method: 'POST',
                        credentials: 'same-origin',
                    });
                    if (!response.ok) return;
                    const payload = await response.json();
                    if (!payload || !payload.token) return;
                    localStorage.setItem(TOKEN_KEY, payload.token);
                    window.location.replace(nextUrl || '/');
                } catch (error) {
                    console.warn('remember 登录恢复失败:', error);
                }
            }

            if (modeSwitch) {
                modeSwitch.addEventListener('click', (event) => {
                    const button = event.target.closest('[data-mode]');
                    if (!button) return;
                    setMode(button.dataset.mode || 'login');
                });
            }

            if (form) {
                form.addEventListener('submit', async (event) => {
                    event.preventDefault();
                    showError('');
                    setStatus('');

                    const username = usernameInput ? usernameInput.value.trim() : '';
                    const password = passwordInput ? passwordInput.value : '';
                    const confirmPassword = confirmPasswordInput ? confirmPasswordInput.value : '';
                    const validationError = validateCredentials(username, password);
                    if (validationError) {
                        showError(validationError);
                        return;
                    }
                    if (authMode === 'register' && password !== confirmPassword) {
                        showError('两次输入的密码不一致');
                        return;
                    }

                    setSubmitting(true);
                    setStatus(authMode === 'register' ? '正在获取公钥并加密注册信息...' : '正在获取公钥并加密登录信息...');

                    try {
                        const keyResponse = await fetch('/api/auth/public-key', {
                            method: 'GET',
                            credentials: 'same-origin',
                        });
                        const keyPayload = await keyResponse.json();
                        if (!keyResponse.ok) {
                            throw new Error(keyPayload.error || '获取登录公钥失败');
                        }

                        const publicKey = await importPublicKey(keyPayload.publicKey);
                        const encryptedUsername = await encryptToHex(publicKey, username);
                        const encryptedPassword = await encryptToHex(publicKey, password);

                        let endpoint = '/api/auth/login';
                        let requestBody = {
                            username: encryptedUsername,
                            password: encryptedPassword,
                        };
                        if (authMode === 'register') {
                            endpoint = '/api/auth/register';
                            requestBody.confirmPassword = await encryptToHex(publicKey, confirmPassword);
                            setStatus('正在创建账号...');
                        } else {
                            requestBody.remember = !!(rememberLoginInput && rememberLoginInput.checked);
                            setStatus('正在校验账号密码...');
                        }

                        const authResponse = await fetch(endpoint, {
                            method: 'POST',
                            credentials: 'same-origin',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(requestBody),
                        });
                        const payload = await authResponse.json();
                        if (!authResponse.ok) {
                            throw new Error(payload.error || (authMode === 'register' ? '注册失败' : '登录失败'));
                        }

                        localStorage.setItem(TOKEN_KEY, payload.token);
                        setStatus(authMode === 'register' ? '注册成功，正在进入工作台...' : '登录成功，正在进入工作台...');
                        window.location.replace(nextUrl || '/');
                    } catch (error) {
                        showError(error && error.message ? error.message : (authMode === 'register' ? '注册失败' : '登录失败'));
                        setSubmitting(false);
                    }
                });
            }

            setMode('login');
            validateStoredToken();
        })();
    </script>
</body>
</html>
