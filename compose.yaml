services:
  matchdrawer:
    build:
      context: .
      dockerfile: Dockerfile
    image: matchdrawer-web:latest
    container_name: matchdrawer-web
    restart: unless-stopped
    user: "1000:1000"
    environment:
      HOME: /tmp
      DATA_DIR: /app/var/data
      DB_PATH: /app/var/data/app.db
      PAPERBANANA_ROOT: /app/integrations/PaperBanana
    env_file:
      - .env
    ports:
      - "8788:8788"
    volumes:
      - ./runtime/data:/app/var/data
      - ./runtime/logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; port=os.getenv('PORT','8788'); urllib.request.urlopen(f'http://127.0.0.1:{port}/login?sso=0', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
